name: Deploy site to GitHub Pages

# Publishes LiveWeather/ to GitHub Pages. Every run first collects active
# tropical-cyclone data and local warnings (NHC, JMA, JTWC, IMD, GDACS, NDMA
# SACHET) into LiveWeather/data/tropical.json, because those feeds don't send
# CORS headers. The schedule keeps that file fresh between code pushes.

on:
  push:
    branches: [main]
    paths: ['LiveWeather/**', 'pipeline/**', '.github/workflows/deploy-pages.yml']
  schedule:
    - cron: '7,37 * * * *'   # every 30 min (agencies issue every 3–6 h; intermediate advisories in between)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Collect tropical cyclone data and local warnings
        run: |
          python pipeline/fetch_tropical.py --out LiveWeather/data/tropical.json \
            || echo '{"generated":null,"storms":[],"status":{"pipeline":{"ok":false}},"india":{"alerts":[]}}' > LiveWeather/data/tropical.json

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: LiveWeather

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
